version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
